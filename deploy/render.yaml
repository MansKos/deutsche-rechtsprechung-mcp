# Render.com Blueprint
services:
  - type: web
    name: deutsche-rechtsprechung-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter  # $7/Monat, persistent disk
    disk:
      name: rechtsprechung-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: RECHTSPRECHUNG_DATA_DIR
        value: /data
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: PORT
        value: "8002"
