app = "deutsche-rechtsprechung-mcp"
primary_region = "fra"  # Frankfurt, Deutschland

[build]

[env]
  RECHTSPRECHUNG_DATA_DIR = "/data"
  MCP_TRANSPORT = "streamable-http"
  PORT = "8002"

[http_service]
  internal_port = 8002
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "rechtsprechung_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
